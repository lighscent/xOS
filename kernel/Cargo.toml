[package]
name = "xos-kernel"
version = "0.1.0"
edition = "2021"
description = "xOS kernel - 32-bit protected mode, VGA text, shell"

[[bin]]
name = "kernel"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
